<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSZ4 - Zettelkasten</title>
  <script src="jsz4.js"></script>  
  <link id="theme-stylesheet" rel="stylesheet" type="text/css" href="JSZ4_gray_v2.css">
</head>

<body>
<!-- Settings Modal -->
<div id="settings-modal" class="modal">
  <div class="modal-content">
    <span class="close-button" onclick="closeSettings()">&times;</span>
    <h2>Settings & Data</h2>
    
    <h3>Appearance</h3>
    <button onclick="JSZ.uiManager.increaseFontSize()">Larger Font (+)</button>
    <button onclick="JSZ.uiManager.decreaseFontSize()">Smaller Font (-)</button>
    <button onclick="setSolarizedTheme()">Solarized Theme</button>
    <button onclick="setGrayTheme()">Gray Theme</button>
    <br><br>

    <h3>Data Management</h3>
    <button onclick="JSZ.storageManager.saveToLocalStorage()">Save to Browser</button>
    <button onclick="JSZ.storageManager.loadFromLocalStorage()">Load from Browser</button>
    <button onclick="download()">Download JSON</button> 
    <br><br>
    <label for="inputJSON" style="font: 0.8em 'Fira Sans', sans-serif;">Load JSON File:</label>
    <input type="file" id="inputJSON" onchange="pullfiles()">
    <br><br>
    <button onclick="cleanBackList()">Reload Back Buttons</button>
    <button onclick="parseAllZettels()">Parse All Zettels</button>
    <button onclick="resetToZstring()">Reset to Default Sample</button>
  </div>
</div>

<!-- Header -->
<div class="header-bar">
  <h1>JSZ4</h1>
  <div class="header-actions">
    <button onclick="openSearchSidebar()">Search</button>
    <button id="split-view-btn" onclick="toggleSplitView()">Split View</button>
    <button onclick="openSettings()">Settings</button>
  </div>
</div>

<!-- Search Sidebar -->
<div id="search-sidebar" class="sidebar search-sidebar">
  <span class="close-button" onclick="closeSearchSidebar()">&times;</span>
  <h2>Navigation</h2>
  
  <div class="sidebar-action-col">
    <div class="search-group vertical">
      <label for="nextz">Go to Zettel:</label>
      <input type="text" id="nextz" placeholder="Zettel key">
      <button onclick="showNextObj()">Go</button>
    </div>
    <hr style="width: 100%; border-color: #555;">
    <div class="search-group vertical">
      <label for="searchRegEx">Search Tags:</label>
      <input type="text" id="searchRegEx" placeholder="Regex allowed">
      <button onclick="searchZettelForRegex()">Search</button>
    </div>
    <div class="search-group vertical">
      <label for="searchFullText">Search Content:</label>
      <input type="text" id="searchFullText" placeholder="Literal search">
      <button onclick="searchZettelContent()">Search</button>
    </div>
    <hr style="width: 100%; border-color: #555;">
    <div id="searchresults">Search Results</div>
  </div>
</div>

<!-- Shared Key Autocomplete Datalist -->
<datalist id="zettel-keys-list"></datalist>

<div class="wrapper" id="main-wrapper">
  <!-- Left Editor Column -->
  <div id="col2" class="editor-col pane-col active-pane">
    <div class="pane-header">
      <div class="pane-header-top">
        <div class="pane-nav">
          <label for="zkey"><strong id="pane-label-left">Note:</strong></label>
          <input type="text" id="zkey" list="zettel-keys-list" placeholder="Select or type key..." onkeydown="if(event.key==='Enter') showLeftObjFromInput()">
          <button onclick="showLeftObjFromInput()" title="Go to Zettel">Go</button>
        </div>
        <div class="pane-actions">
          <button onclick="saveLeftObj()" class="save-btn" title="Save Zettel (Ctrl+P)">Save</button>
          <button id="preview-toggle-btn" onclick="toggleLeftPreviewMode()" title="Toggle Markdown Preview">Preview</button>
          <button onclick="renameLeftZettel()" title="Rename this Zettel">Rename</button>
          <button onclick="deleteLeftZettel()" class="delete-btn" title="Delete this Zettel">Delete</button>
        </div>
      </div>
      <div class="pane-header-bottom">
        <div class="input-group tags-group">
          <label for="zname">Tags:</label>
          <input type="text" id="zname" placeholder="Enter tags here">
        </div>
      </div>
    </div>
    <div class="pane-content-wrap">
      <textarea id="zcontent" placeholder="Zettel content"></textarea>
      <div id="zcontent-preview" style="display: none;"></div>
    </div>
    <div class="pane-footer">
      <span>Date Created: <input type="text" id="zdate" class="status-input" readonly></span>
    </div>
  </div>

  <!-- Resizer between Left and Right Panes -->
  <div id="resizer-split" class="resizer-vertical" style="display: none;" title="Drag to resize panes"></div>

  <!-- Right / Secondary Document Column -->
  <div id="col-right" class="editor-col pane-col secondary-editor-col" style="display: none;">
    <div class="pane-header">
      <div class="pane-header-top">
        <div class="pane-nav">
          <label for="zkey-right"><strong id="pane-label-right">Right:</strong></label>
          <input type="text" id="zkey-right" list="zettel-keys-list" placeholder="Select or type key..." onkeydown="if(event.key==='Enter') showRightObjFromInput()">
          <button onclick="showRightObjFromInput()" title="Go to Zettel">Go</button>
        </div>
        <div class="pane-actions">
          <button onclick="saveRightObj()" class="save-btn" title="Save Zettel">Save</button>
          <button id="preview-toggle-btn-right" onclick="toggleRightPreviewMode()" title="Toggle Markdown Preview">Preview</button>
          <button onclick="renameRightZettel()" title="Rename this Zettel">Rename</button>
          <button onclick="deleteRightZettel()" class="delete-btn" title="Delete this Zettel">Delete</button>
          <button onclick="closeSplitView()" class="close-split-btn" title="Close Split View">&times;</button>
        </div>
      </div>
      <div class="pane-header-bottom">
        <div class="input-group tags-group">
          <label for="zname-right">Tags:</label>
          <input type="text" id="zname-right" placeholder="Enter tags here">
        </div>
      </div>
    </div>
    <div class="pane-content-wrap">
      <textarea id="zcontent-right" placeholder="Right Zettel content"></textarea>
      <div id="zcontent-preview-right" style="display: none;"></div>
    </div>
    <div class="pane-footer">
      <span>Date Created: <input type="text" id="zdate-right" class="status-input" readonly></span>
    </div>
  </div>

  <!-- Resizer between Editor(s) and Links Column -->
  <div id="resizer-links" class="resizer-vertical" title="Drag to resize links column"></div>

  <!-- Links Column -->
  <div id="col-links" class="links-col">
    <div class="links-header-wrap">
      <div class="links-tab-bar" id="links-tab-bar" style="display: none;">
        <button id="tab-links-left" class="links-tab active" onclick="switchLinksTab('left')">Left Note</button>
        <button id="tab-links-right" class="links-tab" onclick="switchLinksTab('right')">Right Note</button>
      </div>
      <div class="links-active-title" id="links-active-title">
        Links for: <strong id="links-current-key">top</strong>
      </div>
    </div>
    <div class="link-section">
      <h3>Outgoing Links</h3>
      <div id="forwardbuttons"></div>
    </div>
    <hr class="link-divider">
    <div class="link-section">
      <h3>Incoming Links</h3>
      <div id="reversebuttons"></div>
    </div>
  </div>
</div>

<!-- Horizontal Height Resizer -->
<div id="resizer-bottom" class="resizer-horizontal" title="Drag to resize height"></div>

<div class="status-bar">
  <span>Total Zettels: <input type="text" id="zcount" class="status-input" readonly></span>
  <span id="active-pane-status">Active Pane: Left</span>
</div>

</body>
</html>
